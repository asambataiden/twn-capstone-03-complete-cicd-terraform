services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: twn-capstone-03:local
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      APP_VERSION: local

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
